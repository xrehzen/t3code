name: i18n catalogs

on:
  pull_request:
    paths:
      - "packages/shared/src/i18n/**"
  push:
    branches: [main]
    paths:
      - "packages/shared/src/i18n/**"

permissions:
  contents: read

jobs:
  catalog-coverage:
    name: Catalog coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The coverage assertions live in the unit test rather than in a separate
      # script, so they cannot drift from what `t()` actually reads. The three
      # things a translation PR can get wrong are all covered there: an English
      # string with no translation, a translation whose interpolation slots
      # disagree with English, and a locale that invents a key English does not
      # define.
      - name: Assert every locale is complete
        run: pnpm exec vp test run packages/shared/src/i18n/index.test.ts

      - name: Unused keys
        run: pnpm knip --include exports --workspace packages/shared --no-config-hints
